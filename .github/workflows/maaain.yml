
name: FGA PCS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Create FGA PCS User
        shell: pwsh
        run: |
          $username = "FGAPCS"
          $displayName = "FGA PCS"

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            throw "The account already exists. Use a fresh runner."
          }

          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $numbers = [char[]](48..57)

          $passwordChars = @()
          $passwordChars += $upper | Get-Random -Count 6
          $passwordChars += $lower | Get-Random -Count 6
          $passwordChars += $numbers | Get-Random -Count 6

          $password = -join (
            $passwordChars | Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          New-LocalUser `
            -Name $username `
            -FullName $displayName `
            -DisplayName $displayName `
            -Password $securePassword `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          "RDP_DISPLAY_NAME=$displayName" >> $env:GITHUB_ENV

          $password | Out-File `
            "$env:RUNNER_TEMP\rdp-password.txt" `
            -Encoding ascii

          Write-Host "FGA PCS account created."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

      - name: Connect to Authorized Tailscale Network
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Configure the TAILSCALE_AUTH_KEY repository secret."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=fga-pcs-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $tsIP = (& $tailscale ip -4 | Select-Object -First 1)

            if ($tsIP) { break }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "No Tailscale IP was assigned."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "Checking RDP service..."

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
            Start-Service TermService
          }

          $listener = Get-NetTCPConnection `
            -State Listen `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP is not listening on port 3389."
          }

          Write-Host "RDP listener detected."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"

      - name: Keep Session Active
        shell: pwsh
        run: |
          Write-Host "=== FGA PCS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Display name: FGA PCS"
          Write-Host "The session ends when the runner limit is reached."

          while ($true) {
            Write-Host "[$(Get-Date)] FGA PCS session active."
            Start-Sleep -Seconds 60
          }

      - name: Clean Up Password File
        if: always()
        shell: pwsh
        run: |
          Remove-Item `
            "$env:RUNNER_TEMP\rdp-password.txt" `
            -Force `
            -ErrorAction SilentlyContinue
